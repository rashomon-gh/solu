[project]
name = "softmax-linear-unit"
version = "1.2.0"
description = "An implementation of softmax linear unit (solu) in PyTorch"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = []


[project.urls]
"Homepage" = "https://github.com/rashomon-gh/solu"
"Repository" = "https://github.com/rashomon-gh/solu.git"
"Issues" = "https://github.com/rashomon-gh/solu/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["SoLU"]

[dependency-groups]
dev = [
    "numpy>=2.4.2",
    "pdoc>=16.0.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.1",
    "torch>=2.10.0",
]
